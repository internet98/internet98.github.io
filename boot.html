<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>internet.98 Startup</title>
<link rel="stylesheet" href="css/system.css">
<style>
body {
  background: #000;
  color: #fff;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Tahoma, sans-serif;
}
.boot { width: min(520px, 90vw); text-align: center; }
.boot img { max-width: 180px; max-height: 130px; object-fit: contain; }
.boot h1 { font-size: 36px; margin: 10px; }
.boot span { color: #ffff00; }
.progress { height: 18px; border: 2px inset #aaa; padding: 2px; margin: 22px 0; }
.progress div { height: 100%; width: 0; background: #00a0ff; }
.boot small { color: #bbb; }
</style>
</head>
<body>
<main class="boot">
  <img src="/logo.png" alt="internet.98"
       onerror="this.hidden=true">
  <h1>internet<span>.98</span></h1>
  <p>Starting your computer...</p>
  <img src="/computer.png" alt="" style="width:55px;height:55px">
  <div class="progress"><div id="bar"></div></div>
  <small id="status">Loading system files...</small>
</main>
<script>
const bar = document.getElementById("bar");
const statusText = document.getElementById("status");
let progress = 0;
const messages = [
  "Loading system files...",
  "Preparing your desktop...",
  "Checking the floppy drive...",
  "Starting internet.98..."
];
const timer = setInterval(() => {
  progress += 5 + Math.random() * 14;
  bar.style.width = Math.min(progress, 100) + "%";
  statusText.textContent = messages[Math.min(3, Math.floor(progress / 26))];
  if (progress >= 100) {
    clearInterval(timer);
    location.href = "desktop.html";
  }
}, 180);
</script>
</body>
</html>
