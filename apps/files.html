<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Files</title>
<link rel="stylesheet" href="../css/system.css">
</head>
<body style="background:#c0c0c0;padding:12px">
<h2>My Files</h2>
<p>Select files to view their names, sizes, and types.</p>
<input type="file" id="files" multiple>
<ul id="list"></ul>
<div id="preview"></div>
<script>
const picker = document.getElementById("files");
const list = document.getElementById("list");
const preview = document.getElementById("preview");

picker.addEventListener("change", () => {
  list.replaceChildren();
  preview.replaceChildren();

  for (const file of picker.files) {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.className = "classic-button";
    button.textContent = file.name + " (" + Math.ceil(file.size / 1024) + " KB)";
    button.addEventListener("click", () => {
      preview.replaceChildren();
      const heading = document.createElement("h3");
      heading.textContent = file.name;
      const detail = document.createElement("p");
      detail.textContent = "Type: " + (file.type || "Unknown") +
        " | Size: " + file.size + " bytes";
      preview.append(heading, detail);

      if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.alt = file.name;
        img.style.maxWidth = "100%";
        img.style.maxHeight = "260px";
        img.src = URL.createObjectURL(file);
        preview.append(img);
      }
    });
    item.append(button);
    list.append(item);
  }
});
</script>
</body>
</html>
